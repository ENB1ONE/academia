<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>FORMCLUB - Redirecionando...</title>
    <script type="text/javascript">
      // Redirecionador SPA para GitHub Pages com suporte a HashRouter
      var pathSegmentsToKeep = 0;
      var l = window.location;
      
      // Se estiver em app.formclub.com.br
      if (l.hostname === 'app.formclub.com.br' || l.hostname === 'localhost') {
        pathSegmentsToKeep = 0;
      } else if (l.pathname.indexOf('/academia') === 0) {
        // Se estiver em enb1one.github.io/academia
        pathSegmentsToKeep = 1;
      }

      var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '');

      if (pathSegmentsToKeep > 0) {
        redirectUrl += '/' + l.pathname.slice(1).split('/')[0];
      }

      redirectUrl += '/#/' + path + (l.search ? l.search : '') + l.hash;
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body style="background-color: #0A0A0C; color: #E5A910; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Redirecionando para o FORMCLUB...</p>
  </body>
</html>
